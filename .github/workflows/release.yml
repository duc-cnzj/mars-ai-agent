# CD：打 v* tag → 先跑测试门禁 → 构建双架构镜像 → 推送。
# 镜像地址与 tag 口径与 mars 主仓保持一致：
#   registry.cn-hangzhou.aliyuncs.com/duc-cnzj/mars-agent（chart 默认 image.repository）
#   Docker Hub duccnzj/mars-agent
#   tag：vX.Y.Z、vX.Y、latest（浮动）
# 只接受 tag 触发：手动输入与 git 无关的版本号会让 semantic-version 派生错误的 vX.Y。
name: build_docker

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# 同一版本不并发发布：中途中断可能留下不完整的多架构 manifest。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 发布前门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go（版本以 go.mod 为准）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt 检查
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt，请本地执行 gofmt -w 后重试："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 单元测试（-race -count=1）
        run: go test ./... -race -count=1

      - name: 安装 Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      # chart 没有独立 CI，发布前必须渲染一遍：防止 Service 被加回、副本数漂移、
      # 镜像仓库写错，或把模型错误地固化进 manifest。
      - name: Helm 门禁（lint + 渲染断言）
        run: |
          helm lint charts/mars-agent --set mars.token=demo-token
          out="$(helm template smoke charts/mars-agent --set mars.token=demo-token)"
          if grep -q '^kind: Service$' <<<"$out"; then
            echo "渲染出了 Service：沙箱不经反向代理，不应创建" >&2
            exit 1
          fi
          if ! grep -q 'replicas: 1' <<<"$out"; then
            echo "副本数不是 1" >&2
            exit 1
          fi
          if ! grep -q 'image: "registry.cn-hangzhou.aliyuncs.com/duc-cnzj/mars-agent:' <<<"$out"; then
            echo "镜像仓库不是 chart 默认值" >&2
            exit 1
          fi
          if grep -q 'name: MARS_MODEL' <<<"$out"; then
            echo "chart 不应注入 MARS_MODEL（模型由入口脚本从 mars 拉取）" >&2
            exit 1
          fi
          # 探针必须走 mars-agent health（内核无关），不能再直打 opencode 的 /health。
          if grep -qE '^[[:space:]]*httpGet:' <<<"$out"; then
            echo "探针不应使用 httpGet，应统一调用 mars-agent health" >&2
            exit 1
          fi
          if [ "$(grep -c '/usr/local/bin/mars-agent' <<<"$out")" -lt 3 ]; then
            echo "未找到三个 exec 探针（mars-agent health）" >&2
            exit 1
          fi
          # 只校验二进制出现次数不够：探针误写成 serve 会在容器里再起一份内核。
          if [ "$(grep -cE '^[[:space:]]*- health$' <<<"$out")" -lt 3 ]; then
            echo "三个探针必须执行 mars-agent health 子命令" >&2
            exit 1
          fi
          if grep -qE '^[[:space:]]*- (serve|mai|mcp-wait|prewarm)$' <<<"$out"; then
            echo "探针不应执行 serve/mai/mcp-wait/prewarm" >&2
            exit 1
          fi
          echo "helm 门禁通过"

      - name: 构建 wrapper
        run: make agent

  # UPX 是运行时解压：必须先证明压缩后的内核真能跑、探针真能通，再允许推送。
  # CI runner 是 amd64，这里验证 amd64；arm64 走同一条 packer 交叉压缩路径，
  # 发布前另需在 arm64 机器上跑一次同样的运行时冒烟（见 README「镜像体积与内存权衡」）。
  image-smoke:
    name: UPX 镜像冒烟（amd64）
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 预置 amd64 opencode（含 sha256 校验）
        run: make agent_opencode ARCHS=amd64

      - name: 构建压缩镜像
        run: docker build --platform linux/amd64 --build-arg OPENCODE_UPX=1 -t mars-agent:smoke .

      - name: 断言内核已压缩且可执行
        run: |
          size="$(docker run --rm --entrypoint /bin/sh mars-agent:smoke -c 'stat -c %s /usr/local/bin/opencode')"
          orig="$(stat -c %s vendor/opencode/opencode-linux-amd64)"
          echo "opencode: ${orig} -> ${size} bytes"
          if [ "$size" -ge "$((orig * 4 / 10))" ]; then
            echo "内核未达到压缩预期（应 < 原体积 40%）" >&2
            exit 1
          fi
          docker run --rm --entrypoint /usr/local/bin/opencode mars-agent:smoke --version

      - name: 启动 serve 并验证 health 探针
        run: |
          docker run -d --name smoke -p 4096:4096 \
            --entrypoint /usr/local/bin/opencode mars-agent:smoke \
            serve --hostname 0.0.0.0 --port 4096
          trap 'docker rm -f smoke' EXIT
          ok=0
          for i in $(seq 1 60); do
            if curl -sf -m 1 http://127.0.0.1:4096/health >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "serve 未在 60s 内就绪" >&2
            docker logs smoke >&2 || true
            exit 1
          fi
          # 与 K8s exec 探针同口径：共享 server 的网络命名空间执行 mars-agent health。
          docker run --rm --network container:smoke \
            --entrypoint /usr/local/bin/mars-agent mars-agent:smoke health

  buildx:
    name: 构建并推送镜像（amd64 + arm64）
    runs-on: ubuntu-latest
    needs: [test, image-smoke]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # semantic-version 依赖完整 tag 历史；默认浅克隆可能只拿到当前 ref。
          fetch-depth: 0

      - name: Set output
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> "$GITHUB_ENV"

      # 与 mars 主仓同一 tag 口径：由 vX.Y.Z 派生 vX.Y。
      - uses: paulhatch/semantic-version@v5.0.2
        id: get_version
        with:
          tag_prefix: "v"

      - name: 安装 QEMU（arm64 运行阶段 apt 安装需要）
        uses: docker/setup-qemu-action@v3

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login registries
        env:
          ALIYUN_DOCKER_PASSWORD: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$ALIYUN_DOCKER_PASSWORD" | docker login registry.cn-hangzhou.aliyuncs.com -u ${{ secrets.ALIYUN_DOCKER_USERNAME }} --password-stdin
          echo "$DOCKER_PASSWORD" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      # 双架构镜像需要两份钉版 opencode；Makefile 会逐个校验 sha256，校验不过即失败。
      - name: 预置钉版 opencode（amd64 + arm64，含 sha256 校验）
        run: make agent_opencode

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          # 默认即为 1；显式写出，避免 Dockerfile 默认值变更时静默失去压缩。
          build-args: OPENCODE_UPX=1
          push: true
          # 与 mars 主仓一致：不打 attestation。
          provenance: false
          sbom: false
          # 不配 cache-from/cache-to：本 workflow 只在 tag 推送时触发，每个 tag 都是
          # 全新 ref，GHA 缓存按 ref 隔离，缓存只写不读、永不命中。
          tags: |
            duccnzj/mars-agent
            duccnzj/mars-agent:${{ env.tag }}
            duccnzj/mars-agent:v${{ steps.get_version.outputs.major }}.${{ steps.get_version.outputs.minor }}
            registry.cn-hangzhou.aliyuncs.com/duc-cnzj/mars-agent:${{ env.tag }}
            registry.cn-hangzhou.aliyuncs.com/duc-cnzj/mars-agent:v${{ steps.get_version.outputs.major }}.${{ steps.get_version.outputs.minor }}
            registry.cn-hangzhou.aliyuncs.com/duc-cnzj/mars-agent
